<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart & Order | USN GLOBAL TRADE</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .cart-page {
            padding-top: 140px;
            padding-bottom: 100px;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 30px;
            align-items: start;
        }

        .cart-item {
            background: #f7f5ef;
            padding: 25px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .cart-item-info {
            flex: 1;
            min-width: 180px;
        }

        .cart-category {
            font-size: 11px;
            font-weight: 700;
            color: #c89b3c;
            letter-spacing: 1px;
        }

        .cart-item-info h3 {
            margin: 7px 0;
            color: #071c2c;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .quantity-btn {
            width: 36px;
            height: 36px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            font-size: 20px;
        }

        .quantity-number {
            min-width: 25px;
            text-align: center;
            font-weight: 700;
        }

        .cart-subtotal {
            color: #1f7a4d;
            font-weight: 700;
        }

        .remove-btn {
            border: none;
            background: transparent;
            color: #c0392b;
            cursor: pointer;
            font-size: 20px;
        }

        .order-box {
            background: #071c2c;
            padding: 30px;
            color: white;
            position: sticky;
            top: 110px;
        }

        .order-box h2 {
            color: white;
            margin: 10px 0 25px;
        }

        .order-field {
            margin-bottom: 15px;
        }

        .order-field label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .order-field input,
        .order-field textarea {
            width: 100%;
            padding: 12px;
            border: none;
            outline: none;
            box-sizing: border-box;
            font-family: inherit;
        }

        .order-total {
            border-top: 1px solid rgba(255,255,255,.2);
            padding-top: 20px;
            margin-top: 20px;
        }

        .order-total h2 {
            color: #8dd5a8;
            margin: 5px 0 20px;
        }

        .empty-cart {
            text-align: center;
            padding: 70px 20px;
            background: #f7f5ef;
        }

        .empty-cart-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .cart-loading {
            text-align: center;
            padding: 50px;
        }

        #orderMessage {
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 900px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }

            .order-box {
                position: static;
            }
        }

        @media (max-width: 600px) {
            .cart-page {
                padding-top: 110px;
            }

            .cart-item {
                align-items: flex-start;
            }
        }
    </style>
</head>


<body>


<header class="header">

    <div class="container navbar">

        <a href="index.html" class="logo">

            <div class="logo-mark">
                USN
            </div>

            <div class="logo-text">

                <strong>
                    USN GLOBAL TRADE
                </strong>

                <small>
                    GLOBAL COMMERCE
                </small>

            </div>

        </a>


        <a href="index.html" class="btn btn-primary">
            ← Continue Shopping
        </a>

    </div>

</header>



<main class="cart-page">

    <div class="container">

        <div class="section-heading">

            <div>

                <p class="section-label">
                    YOUR ORDER
                </p>

                <h1>
                    Shopping <span>Cart</span>
                </h1>

            </div>

        </div>


        <div id="cartContainer">

            <div class="cart-loading">
                Loading cart...
            </div>

        </div>

    </div>

</main>



<footer class="footer">

    <div class="container">

        <div class="footer-bottom">

            <p>
                © <span id="year"></span>
                USN GLOBAL TRADE.
                All rights reserved.
            </p>

        </div>

    </div>

</footer>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

document.addEventListener("DOMContentLoaded", function () {


    /* =========================================
       SUPABASE
    ========================================= */

    const SUPABASE_URL =
        "https://dvyqeiftxliczhllpvvc.supabase.co";

    const SUPABASE_ANON_KEY =
        "sb_publishable_ZulvWci7BNTGbGpiJjoBvQ_pwZu32XV";


    let supabaseClient = null;


    try {

        if (
            window.supabase &&
            SUPABASE_URL &&
            SUPABASE_ANON_KEY
        ) {

            supabaseClient =
                window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_ANON_KEY
                );

        }

    } catch (error) {

        console.error(
            "Supabase error:",
            error
        );

    }



    /* =========================================
       YEAR
    ========================================= */

    const year =
        document.getElementById("year");

    if (year) {

        year.textContent =
            new Date().getFullYear();

    }



    /* =========================================
       GET CART
       Supports BOTH keys
    ========================================= */

    function getCart() {

        let cart = [];


        try {

            const newCart =
                localStorage.getItem("usn_cart");

            const oldCart =
                localStorage.getItem("usnCart");


            if (newCart) {

                cart =
                    JSON.parse(newCart);

            }


            if (
                (!cart || cart.length === 0) &&
                oldCart
            ) {

                cart =
                    JSON.parse(oldCart);

            }


            if (!Array.isArray(cart)) {

                cart = [];

            }

        } catch (error) {

            console.error(
                "Cart read error:",
                error
            );

            cart = [];

        }


        return cart;

    }



    /* =========================================
       SAVE CART
       Saves BOTH keys
    ========================================= */

    function saveCart(cart) {

        try {

            const cartJSON =
                JSON.stringify(cart);


            localStorage.setItem(
                "usn_cart",
                cartJSON
            );


            localStorage.setItem(
                "usnCart",
                cartJSON
            );

        } catch (error) {

            console.error(
                "Cart save error:",
                error
            );

        }

    }



    /* =========================================
       DISPLAY CART
    ========================================= */

    function displayCart() {

        const container =
            document.getElementById(
                "cartContainer"
            );


        if (!container) {
            return;
        }


        const cart =
            getCart();


        console.log(
            "Current cart:",
            cart
        );


        if (
            !cart ||
            cart.length === 0
        ) {

            container.innerHTML = `

                <div class="empty-cart">

                    <div class="empty-cart-icon">
                        🛒
                    </div>

                    <h2>
                        Your Cart is Empty
                    </h2>

                    <p style="margin:20px 0;">
                        Add products from our products page.
                    </p>

                    <a
                        href="products.html"
                        class="btn btn-primary"
                    >
                        Browse Products
                    </a>

                </div>

            `;

            return;

        }



        let total = 0;

        let productsHTML = "";



        cart.forEach(function (
            item,
            index
        ) {

            const name =
                item.name ||
                "Product";


            const category =
                item.category ||
                "PRODUCT";


            const price =
                Number(
                    item.price || 0
                );


            const quantity =
                Number(
                    item.quantity || 1
                );


            const subtotal =
                price * quantity;


            total += subtotal;



            productsHTML += `

                <div class="cart-item">

                    <div class="cart-item-info">

                        <span class="cart-category">
                            ${category}
                        </span>

                        <h3>
                            ${name}
                        </h3>

                        <p>
                            NPR ${price.toLocaleString()}
                        </p>

                    </div>


                    <div class="quantity-box">

                        <button
                            type="button"
                            class="quantity-btn"
                            data-index="${index}"
                            data-change="-1"
                        >
                            −
                        </button>

                        <span class="quantity-number">
                            ${quantity}
                        </span>

                        <button
                            type="button"
                            class="quantity-btn"
                            data-index="${index}"
                            data-change="1"
                        >
                            +
                        </button>

                    </div>


                    <div class="cart-subtotal">

                        NPR ${subtotal.toLocaleString()}

                    </div>


                    <button
                        type="button"
                        class="remove-btn"
                        data-remove="${index}"
                        title="Remove"
                    >
                        ✕
                    </button>

                </div>

            `;

        });



        container.innerHTML = `

            <div class="cart-layout">


                <div>

                    ${productsHTML}

                </div>



                <div class="order-box">

                    <p style="
                        color:#c89b3c;
                        font-size:11px;
                        font-weight:700;
                        letter-spacing:2px;
                    ">
                        CUSTOMER DETAILS
                    </p>


                    <h2>
                        Place Order
                    </h2>


                    <form id="orderForm">


                        <div class="order-field">

                            <label for="customerName">
                                Full Name *
                            </label>

                            <input
                                id="customerName"
                                type="text"
                                placeholder="Your full name"
                                required
                            >

                        </div>



                        <div class="order-field">

                            <label for="customerEmail">
                                Email *
                            </label>

                            <input
                                id="customerEmail"
                                type="email"
                                placeholder="Your email"
                                required
                            >

                        </div>



                        <div class="order-field">

                            <label for="customerPhone">
                                Phone
                            </label>

                            <input
                                id="customerPhone"
                                type="tel"
                                placeholder="Phone number"
                            >

                        </div>



                        <div class="order-field">

                            <label for="customerAddress">
                                Address
                            </label>

                            <textarea
                                id="customerAddress"
                                rows="3"
                                placeholder="Delivery / business address"
                            ></textarea>

                        </div>



                        <div class="order-total">

                            <span>
                                Total
                            </span>

                            <h2 id="orderTotal">
                                NPR ${total.toLocaleString()}
                            </h2>

                        </div>



                        <button
                            type="submit"
                            class="btn btn-primary"
                            style="width:100%;"
                        >
                            Place Order
                        </button>


                        <button
                            type="button"
                            id="clearCartButton"
                            style="
                                width:100%;
                                margin-top:12px;
                                padding:12px;
                                background:transparent;
                                border:1px solid rgba(255,255,255,.3);
                                color:white;
                                cursor:pointer;
                            "
                        >
                            Clear Cart
                        </button>


                        <p id="orderMessage"></p>


                    </form>

                </div>

            </div>

        `;



        /* =========================================
           QUANTITY BUTTONS
        ========================================= */

        document
            .querySelectorAll(".quantity-btn")
            .forEach(function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        const index =
                            Number(
                                this.dataset.index
                            );


                        const change =
                            Number(
                                this.dataset.change
                            );


                        changeQuantity(
                            index,
                            change
                        );

                    }
                );

            });



        /* =========================================
           REMOVE BUTTONS
        ========================================= */

        document
            .querySelectorAll(".remove-btn")
            .forEach(function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        const index =
                            Number(
                                this.dataset.remove
                            );


                        removeFromCart(index);

                    }
                );

            });



        /* =========================================
           CLEAR CART
        ========================================= */

        const clearButton =
            document.getElementById(
                "clearCartButton"
            );


        if (clearButton) {

            clearButton.addEventListener(
                "click",
                function () {

                    clearCart();

                }
            );

        }



        /* =========================================
           ORDER FORM
        ========================================= */

        const orderForm =
            document.getElementById(
                "orderForm"
            );


        if (orderForm) {

            orderForm.addEventListener(
                "submit",
                submitOrder
            );

        }

    }



    /* =========================================
       CHANGE QUANTITY
    ========================================= */

    function changeQuantity(
        index,
        change
    ) {

        const cart =
            getCart();


        if (!cart[index]) {
            return;
        }


        cart[index].quantity =
            Number(
                cart[index].quantity || 1
            ) + change;


        if (
            cart[index].quantity <= 0
        ) {

            cart.splice(index, 1);

        }


        saveCart(cart);

        displayCart();

    }



    /* =========================================
       REMOVE
    ========================================= */

    function removeFromCart(index) {

        const cart =
            getCart();


        if (!cart[index]) {
            return;
        }


        cart.splice(
            index,
            1
        );


        saveCart(cart);

        displayCart();

    }



    /* =========================================
       CLEAR
    ========================================= */

    function clearCart() {

        localStorage.removeItem(
            "usn_cart"
        );

        localStorage.removeItem(
            "usnCart"
        );


        displayCart();

    }



    /* =========================================
       SUBMIT ORDER
    ========================================= */

    async function submitOrder(event) {

        event.preventDefault();


        const message =
            document.getElementById(
                "orderMessage"
            );


        const cart =
            getCart();


        if (
            !cart ||
            cart.length === 0
        ) {

            message.textContent =
                "Your cart is empty.";

            message.style.color =
                "#ff8b8b";

            return;

        }


        if (!supabaseClient) {

            message.textContent =
                "Supabase connection is not configured.";

            message.style.color =
                "#ff8b8b";

            return;

        }


        const customerName =
            document
                .getElementById(
                    "customerName"
                )
                .value
                .trim();


        const customerEmail =
            document
                .getElementById(
                    "customerEmail"
                )
                .value
                .trim();


        const customerPhone =
            document
                .getElementById(
                    "customerPhone"
                )
                .value
                .trim();


        const customerAddress =
            document
                .getElementById(
                    "customerAddress"
                )
                .value
                .trim();


        let total = 0;


        cart.forEach(function (item) {

            total +=
                Number(item.price || 0) *
                Number(item.quantity || 1);

        });


        message.textContent =
            "Placing your order...";


        message.style.color =
            "#c89b3c";


        try {

            const result =
                await supabaseClient
                    .from("orders")
                    .insert([
                        {
                            customer_name:
                                customerName,

                            customer_email:
                                customerEmail,

                            customer_phone:
                                customerPhone ||
                                null,

                            customer_address:
                                customerAddress ||
                                null,

                            total_amount:
                                total,

                            status:
                                "pending"
                        }
                    ]);


            if (result.error) {

                console.error(
                    "Order error:",
                    result.error
                );


                message.textContent =
                    "Order failed: " +
                    result.error.message;


                message.style.color =
                    "#ff8b8b";


                return;

            }


            message.textContent =
                "🎉 Order placed successfully!";


            message.style.color =
                "#8dd5a8";


            localStorage.removeItem(
                "usn_cart"
            );

            localStorage.removeItem(
                "usnCart"
            );


            setTimeout(
                function () {

                    displayCart();

                },
                1500
            );


        } catch (error) {

            console.error(
                "Order error:",
                error
            );


            message.textContent =
                "Something went wrong: " +
                error.message;


            message.style.color =
                "#ff8b8b";

        }

    }



    /* =========================================
       START
    ========================================= */

    displayCart();

});

</script>

</body>
</html>
